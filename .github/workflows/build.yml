name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Official Aozora DB & Project Assets
        run: |
          set -e
          mkdir -p gradle/wrapper app/src/main/res/mipmap-xxxhdpi app/src/main/assets/databases

          # 1. 青空文庫アイコンを配置
          cat << 'EOF' | base64 -d > app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          
          EOF
          cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

          # 2. 青空文庫公式全作品カタログCSVからSQLite DBを自動生成 (プレースホルダ数完全一致)
          python3 -c "
          import urllib.request, zipfile, io, csv, sqlite3

          url = 'https://www.aozora.gr.jp/index_pages/list_person_all_extended_utf8.zip'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          with urllib.request.urlopen(req) as resp:
              z = zipfile.ZipFile(io.BytesIO(resp.read()))
              csv_filename = [f for f in z.namelist() if f.endswith('.csv')][0]
              with z.open(csv_filename) as f:
                  reader = csv.reader(io.TextIOWrapper(f, 'utf-8-sig'))
                  header = next(reader)
                  
                  idx_id = header.index('作品ID')
                  idx_title = header.index('作品名')
                  idx_last = header.index('姓')
                  idx_first = header.index('名')
                  idx_url = header.index('テキストファイルURL')
                  
                  books = {}
                  for r in reader:
                      raw_url = r[idx_url].strip().replace('http://', 'https://')
                      if not raw_url:
                          continue
                      bid = int(r[idx_id])
                      name = (r[idx_last] + r[idx_first]).strip()
                      if bid in books:
                          if name and name not in books[bid][1]:
                              books[bid][1].append(name)
                      else:
                          books[bid] = [r[idx_title].strip(), [name] if name else [], raw_url]
                  
                  db_path = 'app/src/main/assets/databases/aozora_official.db'
                  conn = sqlite3.connect(db_path)
                  c = conn.cursor()
                  c.execute('''
                      CREATE TABLE books (
                          id INTEGER NOT NULL PRIMARY KEY,
                          title TEXT NOT NULL,
                          author TEXT NOT NULL,
                          downloadUrl TEXT NOT NULL,
                          localFilePath TEXT,
                          isDownloaded INTEGER NOT NULL
                      )
                  ''')
                  rows = [
                      (i, t, '・'.join(a) if a else '不明', u, None, 0)
                      for i, (t, a, u) in books.items()
                  ]
                  # プレースホルダを6つに完全一致
                  c.executemany('INSERT INTO books VALUES (?,?,?,?,?,?)', rows)
                  c.execute('PRAGMA user_version = 1')
                  conn.commit()
                  conn.close()
                  print(f'Catalog DB created with {len(rows)} books!')
          "

          # 3. Gradle設定
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "AozoraReader"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.0" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.0" apply false
              id("com.google.devtools.ksp") version "2.0.0-1.0.22" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
              id("com.google.devtools.ksp")
          }

          android {
              namespace = "com.example.aozorareader"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.aozorareader"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 9
                  versionName = "9.0"
              }

              buildTypes {
                  release { isMinifyEnabled = false }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6")

              val roomVersion = "2.6.1"
              implementation("androidx.room:room-runtime:$roomVersion")
              implementation("androidx.room:room-ktx:$roomVersion")
              ksp("androidx.room:room-compiler:$roomVersion")

              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="青空リーダー"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|smallestScreenSize|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
